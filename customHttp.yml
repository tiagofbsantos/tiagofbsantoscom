customHeaders:
  - pattern: "/assets/*"
    headers:
      - key: Cache-Control
        value: public, max-age=31536000, immutable
  - pattern: "/index.html"
    headers:
      - key: Cache-Control
        value: no-cache
  - pattern: "/projects/*/index.html"
    headers:
      - key: Cache-Control
        value: no-cache
  - pattern: "/service-worker.js"
    headers:
      - key: Cache-Control
        value: no-cache
  - pattern: "/manifest.webmanifest"
    headers:
      - key: Cache-Control
        value: no-cache
