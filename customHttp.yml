customHeaders:
  - pattern: "**"
    headers:
      - key: X-Content-Type-Options
        value: nosniff
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
      - key: X-Frame-Options
        value: SAMEORIGIN
      - key: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - key: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
  - pattern: "/assets/*"
    headers:
      - key: Cache-Control
        value: public, max-age=31536000, immutable
  - pattern: "/workbox-*.js"
    headers:
      - key: Cache-Control
        value: public, max-age=31536000, immutable
  - pattern: "/index.html"
    headers:
      - key: Cache-Control
        value: no-cache
  - pattern: "/projects/*/index.html"
    headers:
      - key: Cache-Control
        value: no-cache
  - pattern: "/service-worker.js"
    headers:
      - key: Cache-Control
        value: no-cache
  - pattern: "/manifest.webmanifest"
    headers:
      - key: Cache-Control
        value: no-cache
  - pattern: "/offline.html"
    headers:
      - key: Cache-Control
        value: no-cache
